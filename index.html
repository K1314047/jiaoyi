            font-weight: 600;
            font-size: 0.8rem;

            color: var(--text-primary);

    // 辅助生成展示
    function getMethodDisplay(r) {
        if (r.sourceType === 'exchange') return `🏦 交易所 · ${r.platform}`;
        if (r.sourceType === 'onchain') {
            let hashShort = r.txHash ? r.txHash.slice(0,8)+'...'+r.txHash.slice(-6) : '';
            let explorerLink = '';
            if (r.platform.includes('BSC')) explorerLink = `https://bscscan.com/tx/${r.txHash}`;
            else if (r.platform === 'Arbitrum') explorerLink = `https://arbiscan.io/tx/${r.txHash}`;
            else if (r.platform === 'TRC20') explorerLink = `https://tronscan.org/#/transaction/${r.txHash}`;
            else if (r.platform === 'Polygon') explorerLink = `https://polygonscan.com/tx/${r.txHash}`;
            const linkPart = (r.txHash && explorerLink) ? `<a href="${explorerLink}" target="_blank" class="tx-link">${r.platform}</a>` : r.platform;
            return `🔗 链上 · ${linkPart}`;
        }
        return r.sourceType;
    }

    function getLinkDisplay(r) {
        if (r.link && r.link.trim() !== "") return `<a href="${r.link}" target="_blank" style="color:var(--accent-gold)">📎 原帖证明</a>`;
        return `<span style="color:var(--text-muted); font-size:0.75rem;">私信/无链接</span>`;
    }

    let currentYear = "all";
    let currentAsset = "all";
    let currentView = "table";

    function render() {
        let filtered = rawRecords.filter(rec => {
            const yearMatch = (currentYear === "all" || rec.date.substring(0,4) === currentYear);
            const assetMatch = (currentAsset === "all" || rec.asset === currentAsset);
            return yearMatch && assetMatch;
        });
        // update stats
        let sumUSDT = 0, sumUSDC = 0;
        filtered.forEach(r => { if(r.asset === "USDT") sumUSDT += r.amount; else if(r.asset === "USDC") sumUSDC += r.amount; });
        document.getElementById("totalUSDT").innerHTML = `${sumUSDT.toFixed(2)} <span style="font-size:0.9rem;">USDT</span>`;
        document.getElementById("totalUSDC").innerHTML = `${sumUSDC.toFixed(2)} <span style="font-size:0.9rem;">USDC</span>`;
        document.getElementById("totalCount").innerText = filtered.length;

        // 表格渲染
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        if(filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">暂无匹配记录</td></tr>';
        } else {
            filtered.forEach(r => {
                const assetClass = r.asset === "USDT" ? "asset-symbol" : "asset-symbol usdc";
                const assetColor = r.asset === "USDT" ? "" : "usdc";
                const row = tbody.insertRow();
                row.insertCell(0).innerText = r.date;
                row.insertCell(1).innerHTML = `<div class="asset-badge"><span>${r.amount.toFixed(2)}</span><span class="${assetClass}">${r.asset}</span></div>`;
                row.insertCell(2).innerHTML = `<div class="source-link">${getMethodDisplay(r)}</div>`;
                row.insertCell(3).innerHTML = getLinkDisplay(r);
            });
        }

        // 时间轴渲染
        const timelineDiv = document.getElementById("timelineContainer");
        timelineDiv.innerHTML = "";
        if(filtered.length === 0) {
            timelineDiv.innerHTML = '<div class="empty-msg">暂无匹配记录</div>';
        } else {
            const timelineList = document.createElement("div");
            timelineList.className = "timeline-list";
            filtered.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r => {
                const node = document.createElement("div");
                node.className = "timeline-node";
                node.innerHTML = `
                    <div class="timeline-date">📅 ${r.date}</div>
                    <div class="timeline-asset"><strong>${r.amount.toFixed(2)} ${r.asset}</strong> 
                    <span style="font-size:0.7rem; background:var(--bg-hover); padding:2px 8px; border-radius:20px;">${r.asset}</span></div>
                    <div class="timeline-meta">${getMethodDisplay(r)} · ${getLinkDisplay(r)}</div>
                `;
                timelineList.appendChild(node);
            });
            timelineDiv.appendChild(timelineList);
        }

        // 切换视图样式
        if(currentView === "table") {
            document.getElementById("tableViewContainer").style.display = "block";
            timelineDiv.style.display = "none";
        } else {
            document.getElementById("tableViewContainer").style.display = "none";
            timelineDiv.style.display = "block";
        }
    }

    // 初始化年份下拉
    const yearsSet = new Set();
    rawRecords.forEach(r => yearsSet.add(r.date.substring(0,4)));
    const sortedYears = Array.from(yearsSet).sort((a,b)=>b.localeCompare(a));
    const yearSelect = document.getElementById("yearSelect");
    sortedYears.forEach(y => { const opt = document.createElement("option"); opt.value = y; opt.innerText = y+"年"; yearSelect.appendChild(opt); });
    yearSelect.addEventListener("change", (e) => { currentYear = e.target.value; render(); });
    document.getElementById("assetSelect").addEventListener("change", (e) => { currentAsset = e.target.value; render(); });
    document.getElementById("tableViewBtn").addEventListener("click", () => {
        currentView = "table";
        document.getElementById("tableViewBtn").classList.add("active");
        document.getElementById("timelineViewBtn").classList.remove("active");
        render();
    });
    document.getElementById("timelineViewBtn").addEventListener("click", () => {
        currentView = "timeline";
        document.getElementById("timelineViewBtn").classList.add("active");
        document.getElementById("tableViewBtn").classList.remove("active");
        render();
    });
    // 主题切换
    const themeBtn = document.getElementById("themeToggleBtn");
    const htmlBody = document.body;
    function setTheme(theme) {
        if(theme === "dark") { htmlBody.classList.add("dark"); localStorage.setItem("ark_theme","dark"); themeBtn.innerHTML = "<span>☀️</span> 亮色模式"; }
        else { htmlBody.classList.remove("dark"); localStorage.setItem("ark_theme","light"); themeBtn.innerHTML = "<span>🌙</span> 暗色模式"; }
    }
    const savedTheme = localStorage.getItem("ark_theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(savedTheme);
    themeBtn.addEventListener("click", () => { const isDark = htmlBody.classList.contains("dark"); setTheme(isDark ? "light" : "dark"); });
    render();
</script>
